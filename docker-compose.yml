name: sgrsi

services:

  web:
    build:
      context: .                
      dockerfile: web/Dockerfile
    container_name: sgrsi_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_started
    ports:
      - "82:80"                    
    networks:
      - red_sgrsi

  db:
    image: mariadb:10.4
    container_name: sgrsi_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: cromaroot2026   
      MYSQL_DATABASE: sgrsi                
    volumes:
      - datos_sgrsi:/var/lib/mysql         
      - ./mysql/init:/docker-entrypoint-initdb.d:ro  
    networks:
      - red_sgrsi

networks:
  red_sgrsi:

volumes:
  datos_sgrsi:
